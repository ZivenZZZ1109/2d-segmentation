[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seg2d-toolkit"
version = "0.1.0"
description = "Small, tested utilities for 2D semantic segmentation and image preprocessing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "Pillow>=10.4", "opencv-python-headless>=4.8,<5"]

[project.optional-dependencies]
model = ["torch>=2.6,<3"]

[project.scripts]
seg2d = "seg2d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
